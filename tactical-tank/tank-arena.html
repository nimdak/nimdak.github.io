    replay.frames.forEach((_,i)=>{
      const d=document.createElement('div');
      d.style.cssText='width:7px;height:7px;border-radius:50%;background:#2d2d44;transition:background 0.15s';
      expDots.appendChild(d);
    });
    stopExpAnim();
    expFrame = 0;
    showExpFrame(replay, 0);
    startExpAnim(replay);
    // Scroll to player
    expPlayer.scrollIntoView({behavior:'smooth',block:'nearest'});
    // Update card borders
    grid.querySelectorAll('div').forEach((c,i)=>{
      if(c.querySelector('canvas')) c.style.borderColor = i===idx ? replay.tankColor.bg : '#374151';
    });
  }

  el.querySelector('#exp-close').onclick = ()=>{
    stopExpAnim(); expPlayer.style.display='none'; state.expandedReplay=null;
  };
  expPrev.onclick = ()=>{ stopExpAnim(); showExpFrame(replays[state.expandedReplay], expFrame-1); };
  expNext.onclick = ()=>{ stopExpAnim(); showExpFrame(replays[state.expandedReplay], expFrame+1); };
  expPlay.onclick = ()=>{
    const r = replays[state.expandedReplay];
    if(expPlaying){ stopExpAnim(); }
    else { if(expFrame===r.frames.length-1) showExpFrame(r,0); startExpAnim(r); }
  };
  expCanvas.onclick = ()=>{
    const r = replays[state.expandedReplay];
    stopExpAnim(); showExpFrame(r, expFrame===r.frames.length-1?0:expFrame+1);
  };

  // ── GIF export ──
  el.querySelector('#exp-gif').onclick = ()=>{
    const idx = state.expandedReplay;
    if(idx==null) return;
    const replay = replays[idx];
    const gifBtn = el.querySelector('#exp-gif');
    gifBtn.textContent = '⏳ Encoding…'; gifBtn.disabled = true;

    // Check gif.js loaded
    if(typeof GIF === 'undefined'){
      gifBtn.textContent = '❌ gif.js not loaded'; gifBtn.disabled=false; return;
    }

    const gif = new GIF({
      workers: 2, quality: 6, width: 280, height: 280,
      workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js',
    });

    const offscreen = document.createElement('canvas');
    offscreen.width = 280; offscreen.height = 280;

    replay.frames.forEach((frame, i) => {
      drawReplayFrame(offscreen, replay, frame, frame.isDeath||false);
      // Hold on death frame longer
      const delay = frame.isDeath ? 1200 : (i===0 ? 900 : 550);
      gif.addFrame(offscreen, {delay, copy:true});
    });

    gif.on('finished', blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `killcam-${replay.tankName.toLowerCase()}-r${replay.round}.gif`;
      a.click();
      URL.revokeObjectURL(url);
      gifBtn.textContent = '✅ Downloaded!';
      gifBtn.disabled = false;
      setTimeout(()=>{ gifBtn.textContent='⬇ GIF'; }, 2500);
    });

    gif.on('error', ()=>{
      gifBtn.textContent = '❌ Failed'; gifBtn.disabled=false;
    });

    gif.render();
  };

  // Auto-open first replay
  if(replays.length > 0) setTimeout(()=>openExpanded(0), 100);
}

// ════════════════════════════════════════════════════════════
// GAME ACTIONS
// ════════════════════════════════════════════════════════════
function confirmMoves(){
  const g=state.game; const pid=g.currentPlayer;
  const pending={moves:state.currentMoves.slice(),ammo:state.currentAmmo};
  let newPending=g.pendingMoves.map((m,i)=>i===pid?pending:m);
  const chosenAmmo=state.currentAmmo;
  state.currentMoves=[]; state.currentAmmo='standard';

  // Fill AI
  newPending=newPending.map((m,i)=>{
    if(m!==null) return m;
    const t=g.tanks[i];
    if(!t.alive||!t.isAI) return m;
    return planAIMoves(t,g.tanks,g.projectiles,g.maxMoves,g.arenaMap);
  });

  let next=-1;
  for(let i=1;i<=g.numPlayers;i++){
    const n=(pid+i)%g.numPlayers;
    if(g.tanks[n].alive&&!g.tanks[n].isAI&&newPending[n]===null){next=n;break;}
  }

  const updated={...g,pendingMoves:newPending};

  // Simulate player's moves to get final position
  const {isBlocking}=makeHelpers(g.arenaMap);
  const origTank=g.tanks[pid];
  let row=origTank.row,col=origTank.col,dir=origTank.dir;
  for(const mv of pending.moves){
    if(mv==='L') dir=turnLeft(dir);
    else if(mv==='R') dir=turnRight(dir);
    else if(mv==='F'){const[nr,nc]=movePos(row,col,dir);if(!isBlocking(nr,nc)){row=nr;col=nc;}}
    else if(mv==='B'){const[nr,nc]=movePos(row,col,dir,true);if(!isBlocking(nr,nc)){row=nr;col=nc;}}
  }
  const movedTank={...origTank,row,col,dir};

  // Shot starting position — only solid walls block initial placement, low obstacles (type 2) are fine
  const [dr,dc]=DIR_DELTA[dir];
  const shotRow=row+dr,shotCol=col+dc;
  const shotVisible=inBounds(shotRow,shotCol)&&g.arenaMap[shotRow][shotCol]!==1;
  const newShot=shotVisible?[{row:shotRow,col:shotCol,dir,ownerId:pid,ammo:chosenAmmo,id:Math.random()}]:[];
  const allProjs=[...g.projectiles,...newShot];

  // Visibility for preview
  const helpers=makeHelpers(g.arenaMap);
  const previewVis=helpers.computeVisibility(row,col,dir);
  allProjs.forEach(p=>{
    if(p.ownerId===pid&&p.ammo==='flare') helpers.computeFlareReveal(p.row,p.col).forEach(k=>previewVis.add(k));
    if(p.ownerId===pid) previewVis.add(`${p.row},${p.col}`);
  });

  const previewTanks=g.tanks.map(t=>t.id===pid?movedTank:t);

  // Fire sound
  if(chosenAmmo==='explosive') sounds.fireExplosive();
  else if(chosenAmmo==='flare') sounds.fireFlare();
  else sounds.fireStandard();

  state.game=updated;
  state.shotPreview={tanks:previewTanks,projectiles:allProjs,visibleCells:previewVis,pid,ammo:chosenAmmo,next,updated};
  state.screen='shotpreview';
  render();
}

function doResolveAI(g){
  const game=g||state.game;
  // If all players are AI, generate their moves
  let pending=game.pendingMoves.slice();
  pending=pending.map((m,i)=>{
    if(m!==null) return m;
    const t=game.tanks[i];
    if(!t.alive) return m;
    return planAIMoves(t,game.tanks,game.projectiles,game.maxMoves,game.arenaMap);
  });
  const updated={...game,pendingMoves:pending};
  state.game=updated;
  doResolve(updated);
}

function buildReplays(prevSnapshot, currentSnapshot, afterTanks, afterProjectiles, arenaMap, round){
  if(!prevSnapshot) return [];
  const {isBlocking} = makeHelpers(arenaMap);

  // One replay per newly-dead tank — must have been alive at start of THIS round
  // (currentSnapshot = state before this round's resolution)
  // Guards against re-triggering on tanks killed in previous rounds
  const newlyDead = afterTanks.filter(t =>
    !t.alive &&
    prevSnapshot.tanks.find(pt => pt.id === t.id && pt.alive) &&
    currentSnapshot.tanks.find(ct => ct.id === t.id && ct.alive)
  );
  if(newlyDead.length === 0) return [];

  return newlyDead.map(deadTank => {
    const moves = deadTank._replayMoves || [];
    const startProjs = currentSnapshot.projectiles.map(p=>({...p}));
    const frames = [];

    // Frame 0: end of previous round — tank alive at old position
    frames.push({
      tanks: prevSnapshot.tanks.map(t=>({...t})),
      projectiles: prevSnapshot.projectiles.map(p=>({...p})),
      label: 'Last round',
      isDeath: false,
    });

    // Move frames: simulate this tank's moves one at a time
    // Other tanks stay at round-start positions (context but not focus)
    const simTanks = currentSnapshot.tanks.map(t=>({...t}));
    const moveNames = {F:'Forward',B:'Back',L:'Left',R:'Right'};
    let hitProj = false;

    for(let mi=0; mi<moves.length; mi++){
      if(hitProj) break;
      const mv = moves[mi];
      const idx = simTanks.findIndex(t=>t.id===deadTank.id);
      if(idx<0) break;
      const t = simTanks[idx];

      if(mv==='L') simTanks[idx]={...t,dir:turnLeft(t.dir)};
      else if(mv==='R') simTanks[idx]={...t,dir:turnRight(t.dir)};
      else if(mv==='F'){
        const [nr,nc]=movePos(t.row,t.col,t.dir);
        if(!isBlocking(nr,nc)) simTanks[idx]={...t,row:nr,col:nc};
      }
      else if(mv==='B'){
        const [nr,nc]=movePos(t.row,t.col,t.dir,true);
        if(!isBlocking(nr,nc)) simTanks[idx]={...t,row:nr,col:nc};
      }

      // Check projectile collision — stop simulating if hit
      const cur = simTanks[idx];
      if(startProjs.find(p=>p.row===cur.row&&p.col===cur.col&&p.ammo!=='flare')){
        hitProj = true;
      }

      frames.push({
        tanks: simTanks.map(t=>({...t})),
        projectiles: startProjs.map(p=>({...p})),
        label: `Move ${mi+1}: ${moveNames[mv]||mv}`,
        isDeath: false,
      });
    }

    // Final frame: post-resolution — this tank shown as 💥
    frames.push({
      tanks: afterTanks.map(t=>({...t})),
      projectiles: currentSnapshot.projectiles.map(p=>({...p})),
      label: '💥 Eliminated',
      isDeath: true,
    });

    return {
      tankId: deadTank.id,
      tankColor: deadTank.color,
      tankName: deadTank.color.name, // updated after build via playerNames
      centerRow: deadTank.row,
      centerCol: deadTank.col,
      frames,
      arenaMap,
      round,
      victimCount: 1,
    };
  });
}

function doResolve(g){
  // currentSnapshot = state at START of this round (before resolution) — used for replay frameB projectiles
  const currentSnapshot = {
    tanks: g.tanks.map(t=>({...t})),
    projectiles: g.projectiles.map(p=>({...p})),
  };

  const result=applyMoves(g.tanks,g.projectiles,g.pendingMoves,g.arenaMap);

  // Tag each dead tank with the moves they queued this round, for replay
  const taggedAfterTanks = result.tanks.map(t => {
    if(t.alive) return t;
    const pending = g.pendingMoves[t.id];
    return { ...t, _replayMoves: pending ? (pending.moves||[]) : [] };
  });

  // Build death replays — one grouped event per round
  const replays = buildReplays(g.lastSnapshot, currentSnapshot, taggedAfterTanks, result.projectiles, g.arenaMap, g.round);
  // Note: allReplays accumulation happens in nextRound to avoid duplicates from re-resolve calls

  // ── Spy plane handling ──
  let spyPlane=g.spyPlane;
  let spyPlaneIncoming=g.spyPlaneIncoming;
  let nextPlaneRound=g.nextPlaneRound;
  let planePings=[];
  let planeJustArrived=false;

  // If a plane was incoming, it now enters the arena
  if(spyPlaneIncoming && !spyPlane){
    spyPlane=spyPlaneIncoming;
    spyPlaneIncoming=null;
    planeJustArrived=true;
  }

  // Advance active plane and collect pings
  if(spyPlane){
    spyPlane=advancePlane(spyPlane);
    if(planeStillFlying(spyPlane)){
      planePings=getPlanePings(spyPlane,result.tanks);
    } else {
      spyPlane=null; // exited arena
    }
  }

  // Schedule announcement this round if it's time
  let newAnnouncement=null;
  if(!spyPlane && !spyPlaneIncoming && g.round>=nextPlaneRound){
    newAnnouncement=generatePlaneApproach();
    spyPlaneIncoming=newAnnouncement;
    // Next plane scheduled 5-9 rounds after current
    nextPlaneRound=g.round+5+Math.floor(Math.random()*5);
  }

  state.resolveLog=result.log;
  state.resolveResult={
    ...result,
    spyPlane,
    spyPlaneIncoming,
    nextPlaneRound,
    planePings,
    newAnnouncement,
    newSnapshot: currentSnapshot,
    replays,
  };

  // Sounds
  g.tanks.forEach((t,i)=>{
    if(!t.alive) return;
    const ammo=(g.pendingMoves[t.id]||{}).ammo||'standard';
    setTimeout(()=>{
      if(ammo==='explosive') sounds.fireExplosive();
      else if(ammo==='flare') sounds.fireFlare();
      else sounds.fireStandard();
    }, i*60);
  });
  const kills=result.log.filter(l=>l.includes('destroyed')||l.includes('caught')||l.includes('themselves'));
  kills.forEach((_,i)=>setTimeout(()=>sounds.explosion(),250+i*120));
  const burnouts=result.log.filter(l=>l.includes('burned out'));
  burnouts.forEach((_,i)=>setTimeout(()=>sounds.flareBurnout(),200+i*80));
  if(planePings.length>0){
    planePings.forEach((_,i)=>setTimeout(()=>sounds.radarPing(),300+i*180));
  }

  state.screen='resolve';
  render();
}

let _nextRoundBusy = false;
function nextRound(){
  if(_nextRoundBusy) return;
  _nextRoundBusy = true;
  setTimeout(()=>{ _nextRoundBusy=false; }, 500);

  const res = state.resolveResult || {};
  const {tanks,projectiles,winner,hadElimination,spyPlane,spyPlaneIncoming,nextPlaneRound,newSnapshot} = res;
  const replays = res.replays || [];
  // Consume replays immediately so re-triggers can't double-show them
  if(state.resolveResult) state.resolveResult = {...state.resolveResult, replays: []};
  // Accumulate into end-game gallery exactly once here, tagging with custom names
  if(replays.length > 0){
    const playerNames = state.game.playerNames || {};
    const named = replays.map(r => ({
      ...r,
      tankName: playerNames[r.tankId] || r.tankColor.name,
    }));
    state.allReplays = [...state.allReplays, ...named];
  }

  if(winner!==null){
    state.game={...state.game,tanks,projectiles,winner};
    // Show kill cam before game over if there were deaths
    if(replays && replays.length > 0){
      state.pendingReplays = replays.slice();
      state.afterReplayScreen = 'gameover';
      state.screen = 'replay'; render(); return;
    }
    state.screen='gameover'; render(); return;
  }
  const newMaxMoves=hadElimination?state.game.maxMoves:Math.min(8,state.game.maxMoves+1);
  const firstAliveHuman=tanks.findIndex(t=>t.alive&&!t.isAI);
  const firstAlive=firstAliveHuman!==-1?firstAliveHuman:tanks.findIndex(t=>t.alive);
  state.game={
    ...state.game,tanks,projectiles,
    round:state.game.round+1,maxMoves:newMaxMoves,
    currentPlayer:firstAlive,
    pendingMoves:Array(state.game.numPlayers).fill(null),
    spyPlane: spyPlane||null,
    spyPlaneIncoming: spyPlaneIncoming||null,
    nextPlaneRound: nextPlaneRound||state.game.nextPlaneRound,
    lastSnapshot: newSnapshot||null,
  };
  state.currentMoves=[]; state.currentAmmo='standard';

  // If no humans left alive, fast-forward AI rounds to result
  if(firstAliveHuman === -1){
    fastForwardAI(); return;
  }

  // Show kill cam mid-game if any deaths this round
  if(replays && replays.length > 0){
    state.pendingReplays = replays.slice();
    // After kill cam: go to handoff if any human alive, otherwise trigger next AI resolve
    state.afterReplayScreen = firstAliveHuman!==-1 ? 'handoff' : 'aiResolve';
    state.screen = 'replay'; render(); return;
  }

  state.screen=firstAliveHuman!==-1?'handoff':'resolve';
  if(state.screen==='resolve') doResolveAI();
  else render();
}

// Auto-resolve all remaining AI rounds silently until a winner or max rounds
function fastForwardAI(){
  const MAX_FF_ROUNDS = 200;
  let rounds = 0;
  while(rounds++ < MAX_FF_ROUNDS){
    const g = state.game;
    // Check if there's already a winner
    const alive = g.tanks.filter(t=>t.alive);
    if(alive.length <= 1){
      const winnerId = alive.length===1 ? alive[0].id : -1;
      state.game = {...g, winner: winnerId};
      state.screen = 'gameover';
      render();
      return;
    }
    // Generate AI moves
    let pending = g.pendingMoves.slice();
    pending = pending.map((m,i)=>{
      if(m!==null) return m;
      const t = g.tanks[i];
      if(!t.alive) return m;
      return planAIMoves(t, g.tanks, g.projectiles, g.maxMoves, g.arenaMap);
    });
    const updated = {...g, pendingMoves: pending};
    // Snapshot for replay tracking
    const currentSnapshot = {
      tanks: updated.tanks.map(t=>({...t})),
      projectiles: updated.projectiles.map(p=>({...p})),
    };
    const result = applyMoves(updated.tanks, updated.projectiles, updated.pendingMoves, updated.arenaMap);
    // Tag dead tanks with moves for replays
    const taggedAfterTanks = result.tanks.map(t => {
      if(t.alive) return t;
      const p = updated.pendingMoves[t.id];
      return {...t, _replayMoves: p?(p.moves||[]):[]};
    });
    // Build and accumulate replays
    const replays = buildReplays(g.lastSnapshot, currentSnapshot, taggedAfterTanks, result.projectiles, g.arenaMap, g.round);
    if(replays.length > 0){
      const playerNames = g.playerNames || {};
      const named = replays.map(r=>({...r, tankName: playerNames[r.tankId]||r.tankColor.name}));
      state.allReplays = [...state.allReplays, ...named];
    }
    // Advance game state
    const hadElimination = result.log.some(l=>l.includes('destroyed')||l.includes('caught')||l.includes('themselves'));
    const newMaxMoves = hadElimination ? g.maxMoves : Math.min(8, g.maxMoves+1);
    state.game = {
      ...updated,
      tanks: result.tanks,
      projectiles: result.projectiles,
      round: g.round+1,
      maxMoves: newMaxMoves,
      pendingMoves: Array(g.numPlayers).fill(null),
      lastSnapshot: currentSnapshot,
    };
    if(result.winner !== null){
      state.game = {...state.game, winner: result.winner};
      state.screen = 'gameover';
      render();
      return;
    }
  }
  // Safety: force end after max rounds
  const alive = state.game.tanks.filter(t=>t.alive);
  state.game = {...state.game, winner: alive.length===1?alive[0].id:-1};
  state.screen = 'gameover';
  render();
}

// START
// ════════════════════════════════════════════════════════════
render();
</script>
